name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build, lint, test, and bundle explicit verification artifacts
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug :app:lintReleaseVerification :app:testDebugUnitTest :app:assembleDebug :app:assembleReleaseVerification :app:bundleReleaseVerification --no-daemon --stacktrace

      - name: Install and verify bundletool
        run: |
          set -euo pipefail
          BUNDLETOOL_VERSION=1.18.3
          BUNDLETOOL_SHA256=A099CFA1543F55593BC2ED16A70A7C67FE54B1747BB7301F37FDFD6D91028E29
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output /tmp/bundletool.jar
          echo "${BUNDLETOOL_SHA256}  /tmp/bundletool.jar" | sha256sum --check --strict

      - name: Run release preflight
        shell: pwsh
        run: |
          ./tools/release-preflight.ps1 -RepoRoot . -SkipBuild -BundletoolPath /tmp/bundletool.jar

      - name: Upload unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallpapercropfixer-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload release bundle artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallpapercropfixer-release-bundle
          path: app/build/outputs/bundle/releaseVerification/
          if-no-files-found: ignore

  dependency-policy:
    name: Dependency declaration policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Reject dynamic dependency versions
        run: |
          set -euo pipefail
          if grep -nE 'SNAPSHOT|latest\.release|\+' gradle/libs.versions.toml app/build.gradle.kts; then
            echo 'Dynamic or snapshot dependency version found.' >&2
            exit 1
          fi
          echo 'Dependency declaration policy passed: versions are explicit.'
          echo '::warning::GitHub dependency-review is unavailable for this private repository configuration; OWNER ACTION is required to enable a vulnerability database gate.'

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.3
          GITLEAKS_SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --source . --redact --report-format sarif --report-path /tmp/gitleaks-report.sarif --no-banner
          echo "gitleaks: no secrets found"
